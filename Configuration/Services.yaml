services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Maidemde\TypovigilAgent\:
    resource: '../Classes/*'

  # The scheduler task is unserialized rather than built by the container, so it
  # resolves the sender itself — which only works for a public service.
  Maidemde\TypovigilAgent\Service\ReportSender:
    public: true

  Maidemde\TypovigilAgent\Service\PackageCollector:
    public: true

  Maidemde\TypovigilAgent\Command\SendReportCommand:
    tags:
      - name: 'console.command'
        command: 'typovigil-agent:report'
        description: 'Send the package report to the hub now, instead of waiting for the daily scheduler run'
